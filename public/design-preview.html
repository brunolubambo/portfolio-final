  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Schibsted Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"48c9eaa9-d6ce-4ff6-89b3-e088b6941b14\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Schibsted Grotesk';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"bb4968ff-3486-40b2-8c59-8288707135d8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Schibsted Grotesk';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"48c9eaa9-d6ce-4ff6-89b3-e088b6941b14\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root{\n  --bg:        #0a0a0b;\n  --bg-2:      #0e0e10;\n  --card:      #161618;\n  --card-2:    #1b1b1e;\n  --line:      rgba(255,255,255,.09);\n  --line-2:    rgba(255,255,255,.14);\n  --ink:       #f4f4f3;\n  --ink-soft:  #cfcfcd;\n  --muted:     #8b8b8c;\n  --muted-2:   #6a6a6c;\n  --on-dark:   #0a0a0b;\n  --radius:    26px;\n  --radius-sm: 14px;\n  --maxw:      1240px;\n  --pad:       40px;\n  --ease:      cubic-bezier(.22,.61,.36,1);\n  --font:      'Schibsted Grotesk', system-ui, sans-serif;\n}\n\n*{ box-sizing:border-box; margin:0; padding:0; }\n\nhtml{ scroll-behavior:smooth; }\n\nbody{\n  font-family:var(--font);\n  background:var(--bg);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  line-height:1.5;\n  overflow-x:hidden;\n}\n\na{ color:inherit; text-decoration:none; }\nimg{ display:block; max-width:100%; }\n\n::selection{ background:#fff; color:var(--bg); }\n\n.wrap{ width:100%; max-width:var(--maxw); margin:0 auto; padding:0 var(--pad); }\n\n/* ---- decorative diagonal texture ---- */\n.texture{\n  position:absolute; inset:0; pointer-events:none; z-index:0;\n  background:\n    repeating-linear-gradient(125deg,\n      rgba(255,255,255,.035) 0px,\n      rgba(255,255,255,.035) 1px,\n      transparent 1px,\n      transparent 64px);\n  mask-image:linear-gradient(105deg, transparent 38%, #000 100%);\n  -webkit-mask-image:linear-gradient(105deg, transparent 38%, #000 100%);\n}\n\n/* ============================================================\n   NAV\n   ============================================================ */\n.nav-shell{ position:sticky; top:0; z-index:50; padding:18px var(--pad) 0; }\n.nav{\n  max-width:var(--maxw); margin:0 auto;\n  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;\n  gap:20px;\n  padding:13px 14px 13px 26px;\n  background:rgba(20,20,22,.72);\n  backdrop-filter:blur(18px) saturate(1.2);\n  -webkit-backdrop-filter:blur(18px) saturate(1.2);\n  border:1px solid var(--line);\n  border-radius:999px;\n}\n.nav-left{ display:flex; align-items:center; gap:26px; }\n.nav-link{\n  font-size:15px; font-weight:500; color:var(--ink-soft);\n  position:relative; transition:color .25s var(--ease);\n}\n.nav-link:hover{ color:var(--ink); }\n.nav-link.is-active{ color:var(--ink); }\n.nav-link.is-active::after{\n  content:\"\"; position:absolute; left:0; right:0; bottom:-6px; height:2px;\n  background:var(--ink); border-radius:2px;\n}\n.nav-brand{\n  display:flex; align-items:center; gap:9px; justify-self:center;\n  font-weight:600; font-size:15.5px; letter-spacing:-.01em; white-space:nowrap;\n}\n.nav-right{ display:flex; justify-content:flex-end; }\n.btn-cta{\n  display:inline-flex; align-items:center; gap:9px;\n  background:var(--ink); color:var(--on-dark);\n  font-weight:600; font-size:14.5px;\n  padding:11px 20px; border-radius:999px;\n  border:1px solid transparent;\n  transition:transform .3s var(--ease), background .3s var(--ease);\n}\n.btn-cta:hover{ transform:translateY(-2px); background:#fff; }\n.btn-cta .spark{ width:13px; height:13px; }\n\n.nav-toggle{ display:none; }\n\n/* ============================================================\n   SPARK glyph\n   ============================================================ */\n.spark{ display:inline-block; width:1em; height:1em; flex:none; color:currentColor; vertical-align:-.12em; }\n.spark svg{ width:100%; height:100%; display:block; }\n@keyframes spin-slow{ to{ transform:rotate(360deg); } }\n.spark.spin svg{ animation:spin-slow 22s linear infinite; transform-origin:center; }\n\n/* ============================================================\n   HERO\n   ============================================================ */\n.hero{ position:relative; padding:78px 0 64px; overflow:hidden; }\n.hero .wrap{ position:relative; z-index:1; }\n.hero h1{\n  font-weight:800; letter-spacing:-.03em; line-height:1.02;\n  font-size:clamp(40px, 7.1vw, 96px);\n  max-width:14ch; text-wrap:balance;\n}\n.hero h1 .spark{ width:.72em; height:.72em; color:var(--ink); margin:0 .04em; vertical-align:.02em; }\n.hero-sub{\n  margin-top:30px; font-size:clamp(16px,1.5vw,20px);\n  color:var(--muted); max-width:46ch; font-weight:400;\n}\n.hero-sub a{ color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line-2); }\n.hero-sub a:hover{ text-decoration-color:var(--ink); }\n\n/* ============================================================\n   LOGO STRIP\n   ============================================================ */\n.logos{ border-top:1px solid var(--line); border-bottom:1px solid var(--line); }\n.logos .wrap{\n  display:flex; align-items:center; justify-content:space-between;\n  gap:30px; padding-top:40px; padding-bottom:40px; flex-wrap:wrap;\n}\n.logo{\n  display:flex; align-items:center; gap:11px;\n  color:var(--muted); font-weight:600; font-size:23px; letter-spacing:-.02em;\n  opacity:.72; transition:opacity .3s var(--ease), color .3s var(--ease);\n}\n.logo:hover{ opacity:1; color:var(--ink); }\n.logo svg, .logo .spark{ width:26px; height:26px; flex:none; }\n.logo--figma svg{ width:21px; height:30px; }\n\n/* ============================================================\n   WORK / PROJECT CARDS\n   ============================================================ */\n.work{ padding:84px 0 40px; }\n.section-head{\n  display:flex; align-items:baseline; justify-content:space-between;\n  gap:20px; margin-bottom:38px; flex-wrap:wrap;\n}\n.eyebrow{\n  display:inline-flex; align-items:center; gap:8px;\n  font-size:13px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;\n  color:var(--muted);\n}\n.section-head h2{ font-size:clamp(26px,3vw,40px); font-weight:700; letter-spacing:-.02em; }\n\n.cards{ display:flex; flex-direction:column; gap:30px; }\n.card{\n  position:relative; display:grid; grid-template-columns:1fr 1.08fr; align-items:center;\n  gap:24px; min-height:430px;\n  background:var(--card); border:1px solid var(--line);\n  border-radius:var(--radius); padding:48px;\n  overflow:hidden; isolation:isolate;\n  transition:border-color .4s var(--ease), transform .4s var(--ease), background .4s var(--ease);\n}\n.card::after{\n  content:\"\"; position:absolute; inset:0; z-index:-1; opacity:0;\n  background:radial-gradient(120% 140% at 85% 12%, rgba(255,255,255,.06), transparent 60%);\n  transition:opacity .5s var(--ease);\n}\n.card:hover{ border-color:var(--line-2); transform:translateY(-4px); background:var(--card-2); }\n.card:hover::after{ opacity:1; }\n\n.card-meta{ display:flex; gap:9px; margin-bottom:24px; }\n.chip{\n  font-size:13px; font-weight:500; color:var(--ink-soft);\n  border:1px solid var(--line-2); border-radius:999px; padding:5px 14px;\n  background:rgba(255,255,255,.02);\n}\n.card-title{\n  font-size:clamp(23px,2.3vw,32px); font-weight:700; line-height:1.16;\n  letter-spacing:-.02em; max-width:18ch; text-wrap:balance;\n}\n.card-role{ margin-top:16px; color:var(--muted); font-size:15.5px; }\n.card-link{\n  display:inline-flex; align-items:center; gap:9px; margin-top:30px;\n  font-size:15px; font-weight:600; color:var(--ink);\n}\n.card-link .arrow{ transition:transform .35s var(--ease); }\n.card:hover .card-link .arrow{ transform:translate(5px,-5px); }\n\n.card-visual{\n  position:relative; align-self:stretch; border-radius:18px; overflow:hidden;\n  min-height:330px; background:#0c0c0e;\n  display:flex; align-items:center; justify-content:center;\n}\n.card-visual image-slot{ width:100%; height:100%; }\n.card-visual .slot-pad{ position:absolute; inset:0; }\n\n/* whole-card click overlay */\n.card-hit{ position:absolute; inset:0; z-index:5; }\n\n/* ============================================================\n   CONTACT FOOTER\n   ============================================================ */\n.contact{ position:relative; padding:120px 0 80px; overflow:hidden; }\n.contact .wrap{ position:relative; z-index:1; }\n.contact .label{\n  font-size:14px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;\n  color:var(--muted); margin-bottom:26px;\n}\n.contact .email{\n  display:inline-flex; align-items:center; gap:18px;\n  font-size:clamp(34px,6vw,82px); font-weight:800; letter-spacing:-.03em;\n  line-height:1;\n}\n.contact .email .spark{ width:.62em; height:.62em; color:var(--ink); }\n.contact .email .txt{ text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:8px; text-decoration-color:var(--line-2); transition:text-decoration-color .3s var(--ease); }\n.contact .email:hover .txt{ text-decoration-color:var(--in
